<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCR Layout Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #dfe6eb;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #24343d;
    }
    .hint {
      margin: 0 0 14px;
      font-size: 12px;
      color: #5a6d78;
    }
    .page-wrap {
      margin: 0 auto 24px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      line-height: 0;
    }
    .page {
      position: relative;
      margin: 0 auto;
      background: #fff;
    }
    .page-img {
      display: block;
      width: 100%;
      height: auto;
      /* never stretch/squash — page box matches image pixel size */
    }
    .overlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    .box-table, .box-block {
      position: absolute;
      pointer-events: none;
    }
    .box-table {
      border: 2px solid rgba(20, 140, 90, 0.95);
      background: rgba(20, 140, 90, 0.08);
    }
    .box-block {
      border: 1px solid rgba(25, 105, 160, 0.75);
      background: rgba(25, 105, 160, 0.04);
    }
    .box-block.type-heading,
    .box-block.type-header {
      border-color: rgba(110, 70, 170, 0.85);
      background: rgba(110, 70, 170, 0.05);
    }
    .plain {
      margin: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>OCR Layout Preview</h1>
  <p class="hint">Reference image shown exactly as <code>source_preview</code> (native size, no stretch). Boxes are scaled to that image.</p>
  <div class="page-wrap" style="width:2940px;"><section class="page" style="width:2940px;height:1602px;"><img class="page-img" src="source_preview.jpg" width="2940" height="1602" alt="source preview page 1" /><div class="overlay" style="width:2940px;height:1602px;"><div class="box-table" title="TABLE 0 (two_column_form)" style="left:50px;top:35px;width:2866px;height:1565px;"></div>
<div class="box-table" title="TABLE 1 (wide_grid)" style="left:77px;top:383px;width:2293px;height:765px;"></div>
<div class="box-block type-header" title="BLOCK 0: header" style="left:97px;top:35px;width:2819px;height:53px;"></div>
<div class="box-block type-header" title="BLOCK 1: header" style="left:50px;top:166px;width:736px;height:40px;"></div>
<div class="box-block type-table" title="BLOCK 2: table" style="left:77px;top:307px;width:2747px;height:751px;"></div>
<div class="box-block type-table_row" title="BLOCK 3: table_row" style="left:96px;top:1102px;width:810px;height:46px;"></div>
<div class="box-block type-table" title="BLOCK 4: table" style="left:88px;top:1205px;width:2178px;height:112px;"></div>
<div class="box-block type-table_row" title="BLOCK 5: table_row" style="left:96px;top:1300px;width:411px;height:56px;"></div>
<div class="box-block type-table_row" title="BLOCK 6: table_row" style="left:1856px;top:1374px;width:474px;height:46px;"></div>
<div class="box-block type-footer" title="BLOCK 7: footer" style="left:1856px;top:1473px;width:422px;height:48px;"></div>
<div class="box-block type-footer" title="BLOCK 8: footer" style="left:96px;top:1503px;width:483px;height:97px;"></div></div></section></div>
</body>
</html>
