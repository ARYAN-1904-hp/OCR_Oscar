<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCR Layout Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #dfe6eb;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #24343d;
    }
    .hint {
      margin: 0 0 14px;
      font-size: 12px;
      color: #5a6d78;
    }
    .page-wrap {
      margin: 0 auto 24px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      line-height: 0;
    }
    .page {
      position: relative;
      margin: 0 auto;
      background: #fff;
    }
    .page-img {
      display: block;
      width: 100%;
      height: auto;
      /* never stretch/squash — page box matches image pixel size */
    }
    .overlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    .box-table, .box-block {
      position: absolute;
      pointer-events: none;
    }
    .box-table {
      border: 2px solid rgba(20, 140, 90, 0.95);
      background: rgba(20, 140, 90, 0.08);
    }
    .box-block {
      border: 1px solid rgba(25, 105, 160, 0.75);
      background: rgba(25, 105, 160, 0.04);
    }
    .box-block.type-heading,
    .box-block.type-header {
      border-color: rgba(110, 70, 170, 0.85);
      background: rgba(110, 70, 170, 0.05);
    }
    .plain {
      margin: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>OCR Layout Preview</h1>
  <p class="hint">Reference image shown exactly as <code>source_preview</code> (native size, no stretch). Boxes are scaled to that image.</p>
  <div class="page-wrap" style="width:1920px;"><section class="page" style="width:1920px;height:929px;"><img class="page-img" src="source_preview.jpg" width="1920" height="929" alt="source preview page 1" /><div class="overlay" style="width:1920px;height:929px;"><div class="box-table" title="TABLE 0 (two_column_form)" style="left:19px;top:12px;width:1873px;height:844px;"></div>
<div class="box-table" title="TABLE 1 (wide_grid)" style="left:506px;top:461px;width:1079px;height:59px;"></div>
<div class="box-block type-header" title="BLOCK 0: header" style="left:42px;top:12px;width:1850px;height:72px;"></div>
<div class="box-block type-paragraph" title="BLOCK 1: paragraph" style="left:19px;top:144px;width:1614px;height:131px;"></div>
<div class="box-block type-heading" title="BLOCK 2: heading" style="left:527px;top:318px;width:81px;height:22px;"></div>
<div class="box-block type-paragraph" title="BLOCK 3: paragraph" style="left:505px;top:347px;width:196px;height:104px;"></div>
<div class="box-block type-table" title="BLOCK 4: table" style="left:506px;top:461px;width:1079px;height:59px;"></div>
<div class="box-block type-paragraph" title="BLOCK 5: paragraph" style="left:514px;top:519px;width:18px;height:12px;"></div>
<div class="box-block type-table" title="BLOCK 6: table" style="left:509px;top:543px;width:1087px;height:21px;"></div>
<div class="box-block type-paragraph" title="BLOCK 7: paragraph" style="left:510px;top:571px;width:1099px;height:65px;"></div>
<div class="box-block type-heading" title="BLOCK 8: heading" style="left:523px;top:665px;width:400px;height:24px;"></div>
<div class="box-block type-paragraph" title="BLOCK 9: paragraph" style="left:509px;top:696px;width:428px;height:100px;"></div>
<div class="box-block type-table" title="BLOCK 10: table" style="left:510px;top:803px;width:1052px;height:53px;"></div></div></section></div>
</body>
</html>
