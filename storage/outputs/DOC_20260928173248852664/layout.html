<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCR Layout Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #dfe6eb;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #24343d;
    }
    .hint {
      margin: 0 0 14px;
      font-size: 12px;
      color: #5a6d78;
    }
    .page-wrap {
      margin: 0 auto 24px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      line-height: 0;
    }
    .page {
      position: relative;
      margin: 0 auto;
      background: #fff;
    }
    .page-img {
      display: block;
      width: 100%;
      height: auto;
      /* never stretch/squash — page box matches image pixel size */
    }
    .overlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    .box-table, .box-block {
      position: absolute;
      pointer-events: none;
    }
    .box-table {
      border: 2px solid rgba(20, 140, 90, 0.95);
      background: rgba(20, 140, 90, 0.08);
    }
    .box-block {
      border: 1px solid rgba(25, 105, 160, 0.75);
      background: rgba(25, 105, 160, 0.04);
    }
    .box-block.type-heading,
    .box-block.type-header {
      border-color: rgba(110, 70, 170, 0.85);
      background: rgba(110, 70, 170, 0.05);
    }
    .plain {
      margin: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>OCR Layout Preview</h1>
  <p class="hint">Reference image shown exactly as <code>source_preview</code> (native size, no stretch). Boxes are scaled to that image.</p>
  <div class="page-wrap" style="width:1920px;"><section class="page" style="width:1920px;height:929px;"><img class="page-img" src="source_preview.jpg" width="1920" height="929" alt="source preview page 1" /><div class="overlay" style="width:1920px;height:929px;"><div class="box-table" title="TABLE 0 (two_column_form)" style="left:17px;top:18px;width:1879px;height:408px;"></div>
<div class="box-table" title="TABLE 1 (wide_grid)" style="left:19px;top:424px;width:1512px;height:494px;"></div>
<div class="box-block type-header" title="BLOCK 0: header" style="left:17px;top:18px;width:1879px;height:106px;"></div>
<div class="box-block type-table_row" title="BLOCK 1: table_row" style="left:22px;top:168px;width:824px;height:43px;"></div>
<div class="box-block type-table_row" title="BLOCK 2: table_row" style="left:25px;top:138px;width:113px;height:134px;"></div>
<div class="box-block type-table_row" title="BLOCK 3: table_row" style="left:336px;top:158px;width:134px;height:22px;"></div>
<div class="box-block type-table" title="BLOCK 4: table" style="left:331px;top:275px;width:1192px;height:95px;"></div>
<div class="box-block type-table" title="BLOCK 5: table" style="left:85px;top:368px;width:1271px;height:58px;"></div>
<div class="box-block type-table" title="BLOCK 6: table" style="left:19px;top:424px;width:1512px;height:63px;"></div>
<div class="box-block type-table_row" title="BLOCK 7: table_row" style="left:882px;top:483px;width:641px;height:20px;"></div>
<div class="box-block type-table" title="BLOCK 8: table" style="left:19px;top:503px;width:1505px;height:229px;"></div>
<div class="box-block type-table" title="BLOCK 9: table" style="left:1162px;top:717px;width:361px;height:20px;"></div>
<div class="box-block type-table" title="BLOCK 10: table" style="left:19px;top:737px;width:1505px;height:130px;"></div>
<div class="box-block type-footer" title="BLOCK 11: footer" style="left:24px;top:862px;width:1499px;height:39px;"></div>
<div class="box-block type-footer" title="BLOCK 12: footer" style="left:751px;top:899px;width:364px;height:19px;"></div></div></section></div>
</body>
</html>
