<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCR Layout Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #dfe6eb;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #24343d;
    }
    .hint {
      margin: 0 0 14px;
      font-size: 12px;
      color: #5a6d78;
    }
    .page-wrap {
      margin: 0 auto 24px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      line-height: 0;
    }
    .page {
      position: relative;
      margin: 0 auto;
      background: #fff;
    }
    .page-img {
      display: block;
      width: 100%;
      height: auto;
      /* never stretch/squash — page box matches image pixel size */
    }
    .overlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    .box-table, .box-block {
      position: absolute;
      pointer-events: none;
    }
    .box-table {
      border: 2px solid rgba(20, 140, 90, 0.95);
      background: rgba(20, 140, 90, 0.08);
    }
    .box-block {
      border: 1px solid rgba(25, 105, 160, 0.75);
      background: rgba(25, 105, 160, 0.04);
    }
    .box-block.type-heading,
    .box-block.type-header {
      border-color: rgba(110, 70, 170, 0.85);
      background: rgba(110, 70, 170, 0.05);
    }
    .plain {
      margin: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>OCR Layout Preview</h1>
  <p class="hint">Reference image shown exactly as <code>source_preview</code> (native size, no stretch). Boxes are scaled to that image.</p>
  <div class="page-wrap" style="width:1920px;"><section class="page" style="width:1920px;height:929px;"><img class="page-img" src="source_preview.jpg" width="1920" height="929" alt="source preview page 1" /><div class="overlay" style="width:1920px;height:929px;"><div class="box-table" title="TABLE 0 (two_column_form)" style="left:17px;top:13px;width:1879px;height:710px;"></div>
<div class="box-table" title="TABLE 1 (wide_grid)" style="left:36px;top:275px;width:1487px;height:143px;"></div>
<div class="box-table" title="TABLE 2 (wide_grid)" style="left:19px;top:426px;width:1512px;height:279px;"></div>
<div class="box-table" title="TABLE 3 (wide_grid)" style="left:22px;top:717px;width:1503px;height:56px;"></div>
<div class="box-table" title="TABLE 4 (wide_grid)" style="left:23px;top:765px;width:1501px;height:146px;"></div>
<div class="box-block type-header" title="BLOCK 0: header" style="left:17px;top:13px;width:1879px;height:109px;"></div>
<div class="box-block type-table_row" title="BLOCK 1: table_row" style="left:20px;top:126px;width:102px;height:30px;"></div>
<div class="box-block type-table_row" title="BLOCK 2: table_row" style="left:23px;top:158px;width:447px;height:84px;"></div>
<div class="box-block type-table_row" title="BLOCK 3: table_row" style="left:23px;top:185px;width:875px;height:35px;"></div>
<div class="box-block type-table" title="BLOCK 4: table" style="left:19px;top:275px;width:1512px;height:245px;"></div>
<div class="box-block type-table_row" title="BLOCK 5: table_row" style="left:1162px;top:514px;width:362px;height:23px;"></div>
<div class="box-block type-table" title="BLOCK 6: table" style="left:19px;top:533px;width:1504px;height:172px;"></div>
<div class="box-block type-table" title="BLOCK 7: table" style="left:750px;top:701px;width:53px;height:22px;"></div>
<div class="box-block type-table" title="BLOCK 8: table" style="left:22px;top:717px;width:1503px;height:150px;"></div>
<div class="box-block type-footer" title="BLOCK 9: footer" style="left:23px;top:862px;width:1500px;height:49px;"></div></div></section></div>
</body>
</html>
