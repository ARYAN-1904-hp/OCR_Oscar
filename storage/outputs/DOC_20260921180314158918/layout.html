<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCR Layout Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #dfe6eb;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #24343d;
    }
    .hint {
      margin: 0 0 14px;
      font-size: 12px;
      color: #5a6d78;
    }
    .page-wrap {
      margin: 0 auto 24px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      line-height: 0;
    }
    .page {
      position: relative;
      margin: 0 auto;
      background: #fff;
    }
    .page-img {
      display: block;
      width: 100%;
      height: auto;
      /* never stretch/squash — page box matches image pixel size */
    }
    .overlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    .box-table, .box-block {
      position: absolute;
      pointer-events: none;
    }
    .box-table {
      border: 2px solid rgba(20, 140, 90, 0.95);
      background: rgba(20, 140, 90, 0.08);
    }
    .box-block {
      border: 1px solid rgba(25, 105, 160, 0.75);
      background: rgba(25, 105, 160, 0.04);
    }
    .box-block.type-heading,
    .box-block.type-header {
      border-color: rgba(110, 70, 170, 0.85);
      background: rgba(110, 70, 170, 0.05);
    }
    .plain {
      margin: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>OCR Layout Preview</h1>
  <p class="hint">Reference image shown exactly as <code>source_preview</code> (native size, no stretch). Boxes are scaled to that image.</p>
  <div class="page-wrap" style="width:892px;"><section class="page" style="width:892px;height:470px;"><img class="page-img" src="source_preview.png" width="892" height="470" alt="source preview page 1" /><div class="overlay" style="width:892px;height:470px;"><div class="box-table" title="TABLE 0 (two_column_form)" style="left:37px;top:0px;width:844px;height:444px;"></div>
<div class="box-table" title="TABLE 1 (ppstructure)" style="left:23px;top:21px;width:867px;height:446px;"></div>
<div class="box-block type-header" title="BLOCK 0: header" style="left:52px;top:0px;width:436px;height:11px;"></div>
<div class="box-block type-header" title="BLOCK 1: header" style="left:41px;top:39px;width:704px;height:14px;"></div>
<div class="box-block type-table_row" title="BLOCK 2: table_row" style="left:40px;top:98px;width:188px;height:17px;"></div>
<div class="box-block type-table" title="BLOCK 3: table" style="left:37px;top:136px;width:768px;height:77px;"></div>
<div class="box-block type-table_row" title="BLOCK 4: table_row" style="left:37px;top:231px;width:498px;height:81px;"></div>
<div class="box-block type-table" title="BLOCK 5: table" style="left:38px;top:327px;width:841px;height:33px;"></div>
<div class="box-block type-table_row" title="BLOCK 6: table_row" style="left:37px;top:369px;width:267px;height:32px;"></div>
<div class="box-block type-table" title="BLOCK 7: table" style="left:38px;top:411px;width:843px;height:33px;"></div></div></section></div>
</body>
</html>
