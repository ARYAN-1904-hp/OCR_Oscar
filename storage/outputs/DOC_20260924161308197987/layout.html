<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCR Layout Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #dfe6eb;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #24343d;
    }
    .hint {
      margin: 0 0 14px;
      font-size: 12px;
      color: #5a6d78;
    }
    .page-wrap {
      margin: 0 auto 24px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      line-height: 0;
    }
    .page {
      position: relative;
      margin: 0 auto;
      background: #fff;
    }
    .page-img {
      display: block;
      width: 100%;
      height: auto;
      /* never stretch/squash — page box matches image pixel size */
    }
    .overlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    .box-table, .box-block {
      position: absolute;
      pointer-events: none;
    }
    .box-table {
      border: 2px solid rgba(20, 140, 90, 0.95);
      background: rgba(20, 140, 90, 0.08);
    }
    .box-block {
      border: 1px solid rgba(25, 105, 160, 0.75);
      background: rgba(25, 105, 160, 0.04);
    }
    .box-block.type-heading,
    .box-block.type-header {
      border-color: rgba(110, 70, 170, 0.85);
      background: rgba(110, 70, 170, 0.05);
    }
    .plain {
      margin: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>OCR Layout Preview</h1>
  <p class="hint">Reference image shown exactly as <code>source_preview</code> (native size, no stretch). Boxes are scaled to that image.</p>
  <div class="page-wrap" style="width:903px;"><section class="page" style="width:903px;height:508px;"><img class="page-img" src="source_preview.png" width="903" height="508" alt="source preview page 1" /><div class="overlay" style="width:903px;height:508px;"><div class="box-table" title="TABLE 0 (two_column_form)" style="left:11px;top:116px;width:490px;height:385px;"></div>
<div class="box-table" title="TABLE 1 (wide_grid)" style="left:25px;top:21px;width:855px;height:90px;"></div>
<div class="box-block type-header" title="BLOCK 0: header" style="left:51px;top:21px;width:829px;height:13px;"></div>
<div class="box-block type-table" title="BLOCK 1: table" style="left:25px;top:56px;width:836px;height:13px;"></div>
<div class="box-block type-paragraph" title="BLOCK 2: paragraph" style="left:25px;top:97px;width:312px;height:14px;"></div>
<div class="box-block type-label_value" title="BLOCK 3: label_value" style="left:25px;top:116px;width:117px;height:10px;"></div>
<div class="box-block type-paragraph" title="BLOCK 4: paragraph" style="left:26px;top:130px;width:46px;height:9px;"></div>
<div class="box-block type-table" title="BLOCK 5: table" style="left:24px;top:137px;width:826px;height:160px;"></div>
<div class="box-block type-heading" title="BLOCK 6: heading" style="left:222px;top:288px;width:131px;height:14px;"></div>
<div class="box-block type-heading" title="BLOCK 7: heading" style="left:222px;top:309px;width:133px;height:11px;"></div>
<div class="box-block type-table" title="BLOCK 8: table" style="left:25px;top:318px;width:253px;height:15px;"></div>
<div class="box-block type-paragraph" title="BLOCK 9: paragraph" style="left:25px;top:335px;width:150px;height:13px;"></div>
<div class="box-block type-table" title="BLOCK 10: table" style="left:25px;top:355px;width:311px;height:16px;"></div>
<div class="box-block type-paragraph" title="BLOCK 11: paragraph" style="left:25px;top:374px;width:149px;height:10px;"></div>

</body>
</html>
