<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCR Layout Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #dfe6eb;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #24343d;
    }
    .hint {
      margin: 0 0 14px;
      font-size: 12px;
      color: #5a6d78;
    }
    .page-wrap {
      margin: 0 auto 24px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      line-height: 0;
    }
    .page {
      position: relative;
      margin: 0 auto;
      background: #fff;
    }
    .page-img {
      display: block;
      width: 100%;
      height: auto;
      /* never stretch/squash — page box matches image pixel size */
    }
    .overlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    .box-table, .box-block {
      position: absolute;
      pointer-events: none;
    }
    .box-table {
      border: 2px solid rgba(20, 140, 90, 0.95);
      background: rgba(20, 140, 90, 0.08);
    }
    .box-block {
      border: 1px solid rgba(25, 105, 160, 0.75);
      background: rgba(25, 105, 160, 0.04);
    }
    .box-block.type-heading,
    .box-block.type-header {
      border-color: rgba(110, 70, 170, 0.85);
      background: rgba(110, 70, 170, 0.05);
    }
    .plain {
      margin: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>OCR Layout Preview</h1>
  <p class="hint">Reference image shown exactly as <code>source_preview</code> (native size, no stretch). Boxes are scaled to that image.</p>
  <div class="page-wrap" style="width:1379px;"><section class="page" style="width:1379px;height:724px;"><img class="page-img" src="source_preview.jpg" width="1379" height="724" alt="source preview page 1" /><div class="overlay" style="width:1379px;height:724px;"><div class="box-table" title="TABLE 0 (two_column_form)" style="left:17px;top:11px;width:1338px;height:698px;"></div>
<div class="box-block type-header" title="BLOCK 0: header" style="left:42px;top:11px;width:1313px;height:28px;"></div>
<div class="box-block type-header" title="BLOCK 1: header" style="left:17px;top:67px;width:296px;height:19px;"></div>
<div class="box-block type-table" title="BLOCK 2: table" style="left:27px;top:122px;width:1294px;height:57px;"></div>
<div class="box-block type-table" title="BLOCK 3: table" style="left:31px;top:175px;width:157px;height:13px;"></div>
<div class="box-block type-table" title="BLOCK 4: table" style="left:369px;top:198px;width:664px;height:21px;"></div>
<div class="box-block type-label_value" title="BLOCK 5: label_value" style="left:37px;top:219px;width:212px;height:18px;"></div>
<div class="box-block type-table" title="BLOCK 6: table" style="left:36px;top:238px;width:1051px;height:219px;"></div>
<div class="box-block type-heading" title="BLOCK 7: heading" style="left:39px;top:473px;width:921px;height:25px;"></div>
<div class="box-block type-table" title="BLOCK 8: table" style="left:38px;top:498px;width:1091px;height:108px;"></div>
<div class="box-block type-heading" title="BLOCK 9: heading" style="left:865px;top:629px;width:92px;height:14px;"></div>
<div class="box-block type-footer" title="BLOCK 10: footer" style="left:41px;top:667px;width:1010px;height:35px;"></div>
<div class="box-block type-footer" title="BLOCK 11: footer" style="left:41px;top:692px;width:190px;height:17px;"></div></div></section></div>
</body>
</html>
