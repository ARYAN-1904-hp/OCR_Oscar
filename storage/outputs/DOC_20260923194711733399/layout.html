<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCR Layout Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #dfe6eb;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #24343d;
    }
    .hint {
      margin: 0 0 14px;
      font-size: 12px;
      color: #5a6d78;
    }
    .page-wrap {
      margin: 0 auto 24px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      line-height: 0;
    }
    .page {
      position: relative;
      margin: 0 auto;
      background: #fff;
    }
    .page-img {
      display: block;
      width: 100%;
      height: auto;
      /* never stretch/squash — page box matches image pixel size */
    }
    .overlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    .box-table, .box-block {
      position: absolute;
      pointer-events: none;
    }
    .box-table {
      border: 2px solid rgba(20, 140, 90, 0.95);
      background: rgba(20, 140, 90, 0.08);
    }
    .box-block {
      border: 1px solid rgba(25, 105, 160, 0.75);
      background: rgba(25, 105, 160, 0.04);
    }
    .box-block.type-heading,
    .box-block.type-header {
      border-color: rgba(110, 70, 170, 0.85);
      background: rgba(110, 70, 170, 0.05);
    }
    .plain {
      margin: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>OCR Layout Preview</h1>
  <p class="hint">Reference image shown exactly as <code>source_preview</code> (native size, no stretch). Boxes are scaled to that image.</p>
  <div class="page-wrap" style="width:1440px;"><section class="page" style="width:1440px;height:1000px;"><img class="page-img" src="source_preview.png" width="1440" height="1000" alt="source preview page 1" /><div class="overlay" style="width:1440px;height:1000px;"><div class="box-table" title="TABLE 0 (two_column_form)" style="left:25px;top:7px;width:1361px;height:759px;"></div>
<div class="box-block type-header" title="BLOCK 0: header" style="left:25px;top:7px;width:1361px;height:68px;"></div>
<div class="box-block type-header" title="BLOCK 1: header" style="left:33px;top:62px;width:1329px;height:42px;"></div>
<div class="box-block type-table" title="BLOCK 2: table" style="left:46px;top:120px;width:615px;height:21px;"></div>
<div class="box-block type-label_value" title="BLOCK 3: label_value" style="left:38px;top:169px;width:706px;height:15px;"></div>
<div class="box-block type-table" title="BLOCK 4: table" style="left:33px;top:211px;width:1269px;height:219px;"></div>
<div class="box-block type-heading" title="BLOCK 5: heading" style="left:36px;top:450px;width:182px;height:17px;"></div>
<div class="box-block type-label_value" title="BLOCK 6: label_value" style="left:32px;top:477px;width:388px;height:36px;"></div>
<div class="box-block type-table" title="BLOCK 7: table" style="left:33px;top:521px;width:711px;height:118px;"></div>
<div class="box-block type-heading" title="BLOCK 8: heading" style="left:34px;top:655px;width:373px;height:17px;"></div>
<div class="box-block type-table" title="BLOCK 9: table" style="left:35px;top:685px;width:959px;height:37px;"></div>
<div class="box-block type-label_value" title="BLOCK 10: label_value" style="left:35px;top:729px;width:711px;height:37px;"></div></div></section></div>
</body>
</html>
