<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCR Layout Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #dfe6eb;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #24343d;
    }
    .hint {
      margin: 0 0 14px;
      font-size: 12px;
      color: #5a6d78;
    }
    .page-wrap {
      margin: 0 auto 24px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      line-height: 0;
    }
    .page {
      position: relative;
      margin: 0 auto;
      background: #fff;
    }
    .page-img {
      display: block;
      width: 100%;
      height: auto;
      /* never stretch/squash — page box matches image pixel size */
    }
    .overlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    .box-table, .box-block {
      position: absolute;
      pointer-events: none;
    }
    .box-table {
      border: 2px solid rgba(20, 140, 90, 0.95);
      background: rgba(20, 140, 90, 0.08);
    }
    .box-block {
      border: 1px solid rgba(25, 105, 160, 0.75);
      background: rgba(25, 105, 160, 0.04);
    }
    .box-block.type-heading,
    .box-block.type-header {
      border-color: rgba(110, 70, 170, 0.85);
      background: rgba(110, 70, 170, 0.05);
    }
    .plain {
      margin: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>OCR Layout Preview</h1>
  <p class="hint">Reference image shown exactly as <code>source_preview</code> (native size, no stretch). Boxes are scaled to that image.</p>
  <div class="page-wrap" style="width:1920px;"><section class="page" style="width:1920px;height:929px;"><img class="page-img" src="source_preview.jpg" width="1920" height="929" alt="source preview page 1" /><div class="overlay" style="width:1920px;height:929px;"><div class="box-table" title="TABLE 0 (two_column_form)" style="left:17px;top:13px;width:1848px;height:520px;"></div>
<div class="box-table" title="TABLE 1 (wide_grid)" style="left:29px;top:215px;width:1794px;height:47px;"></div>
<div class="box-table" title="TABLE 2 (wide_grid)" style="left:30px;top:573px;width:1613px;height:355px;"></div>
<div class="box-block type-header" title="BLOCK 0: header" style="left:17px;top:13px;width:1829px;height:84px;"></div>
<div class="box-block type-table" title="BLOCK 1: table" style="left:31px;top:161px;width:1781px;height:27px;"></div>
<div class="box-block type-table_row" title="BLOCK 2: table_row" style="left:1709px;top:202px;width:156px;height:15px;"></div>
<div class="box-block type-table" title="BLOCK 3: table" style="left:29px;top:215px;width:1794px;height:47px;"></div>
<div class="box-block type-table_row" title="BLOCK 4: table_row" style="left:29px;top:266px;width:1820px;height:51px;"></div>
<div class="box-block type-table_row" title="BLOCK 5: table_row" style="left:48px;top:384px;width:379px;height:18px;"></div>
<div class="box-block type-table_row" title="BLOCK 6: table_row" style="left:31px;top:451px;width:154px;height:82px;"></div>
<div class="box-block type-table" title="BLOCK 7: table" style="left:30px;top:573px;width:1612px;height:82px;"></div>
<div class="box-block type-table" title="BLOCK 8: table" style="left:589px;top:667px;width:649px;height:21px;"></div>
<div class="box-block type-table" title="BLOCK 9: table" style="left:30px;top:700px;width:1232px;height:61px;"></div>

</body>
</html>
