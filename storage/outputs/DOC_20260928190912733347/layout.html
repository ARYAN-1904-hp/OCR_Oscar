<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCR Layout Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #dfe6eb;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #24343d;
    }
    .hint {
      margin: 0 0 14px;
      font-size: 12px;
      color: #5a6d78;
    }
    .page-wrap {
      margin: 0 auto 24px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      line-height: 0;
    }
    .page {
      position: relative;
      margin: 0 auto;
      background: #fff;
    }
    .page-img {
      display: block;
      width: 100%;
      height: auto;
      /* never stretch/squash — page box matches image pixel size */
    }
    .overlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    .box-table, .box-block {
      position: absolute;
      pointer-events: none;
    }
    .box-table {
      border: 2px solid rgba(20, 140, 90, 0.95);
      background: rgba(20, 140, 90, 0.08);
    }
    .box-block {
      border: 1px solid rgba(25, 105, 160, 0.75);
      background: rgba(25, 105, 160, 0.04);
    }
    .box-block.type-heading,
    .box-block.type-header {
      border-color: rgba(110, 70, 170, 0.85);
      background: rgba(110, 70, 170, 0.05);
    }
    .plain {
      margin: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>OCR Layout Preview</h1>
  <p class="hint">Reference image shown exactly as <code>source_preview</code> (native size, no stretch). Boxes are scaled to that image.</p>
  <div class="page-wrap" style="width:1920px;"><section class="page" style="width:1920px;height:929px;"><img class="page-img" src="source_preview.jpg" width="1920" height="929" alt="source preview page 1" /><div class="overlay" style="width:1920px;height:929px;"><div class="box-table" title="TABLE 0 (two_column_form)" style="left:36px;top:458px;width:1794px;height:433px;"></div>
<div class="box-table" title="TABLE 1 (wide_grid)" style="left:36px;top:16px;width:1538px;height:436px;"></div>
<div class="box-block type-header" title="BLOCK 0: header" style="left:36px;top:16px;width:1538px;height:86px;"></div>
<div class="box-block type-table" title="BLOCK 1: table" style="left:36px;top:146px;width:1730px;height:272px;"></div>
<div class="box-block type-table" title="BLOCK 2: table" style="left:36px;top:409px;width:420px;height:43px;"></div>
<div class="box-block type-heading" title="BLOCK 3: heading" style="left:358px;top:458px;width:288px;height:20px;"></div>
<div class="box-block type-table" title="BLOCK 4: table" style="left:36px;top:486px;width:614px;height:24px;"></div>
<div class="box-block type-paragraph" title="BLOCK 5: paragraph" style="left:38px;top:511px;width:231px;height:26px;"></div>
<div class="box-block type-table" title="BLOCK 6: table" style="left:26px;top:547px;width:1778px;height:98px;"></div>
<div class="box-block type-table" title="BLOCK 7: table" style="left:1541px;top:643px;width:289px;height:20px;"></div>
<div class="box-block type-table" title="BLOCK 8: table" style="left:35px;top:657px;width:1795px;height:75px;"></div>
<div class="box-block type-table" title="BLOCK 9: table" style="left:42px;top:745px;width:1624px;height:47px;"></div>
<div class="box-block type-table" title="BLOCK 10: table" style="left:361px;top:791px;width:1369px;height:58px;"></div>
<div class="box-block type-table" title="BLOCK 11: table" style="left:42px;top:845px;width:174px;height:16px;"></div>

</body>
</html>
