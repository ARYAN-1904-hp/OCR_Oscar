<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCR Layout Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #dfe6eb;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #24343d;
    }
    .hint {
      margin: 0 0 14px;
      font-size: 12px;
      color: #5a6d78;
    }
    .page-wrap {
      margin: 0 auto 24px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      line-height: 0;
    }
    .page {
      position: relative;
      margin: 0 auto;
      background: #fff;
    }
    .page-img {
      display: block;
      width: 100%;
      height: auto;
      /* never stretch/squash — page box matches image pixel size */
    }
    .overlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    .box-table, .box-block {
      position: absolute;
      pointer-events: none;
    }
    .box-table {
      border: 2px solid rgba(20, 140, 90, 0.95);
      background: rgba(20, 140, 90, 0.08);
    }
    .box-block {
      border: 1px solid rgba(25, 105, 160, 0.75);
      background: rgba(25, 105, 160, 0.04);
    }
    .box-block.type-heading,
    .box-block.type-header {
      border-color: rgba(110, 70, 170, 0.85);
      background: rgba(110, 70, 170, 0.05);
    }
    .plain {
      margin: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>OCR Layout Preview</h1>
  <p class="hint">Reference image shown exactly as <code>source_preview</code> (native size, no stretch). Boxes are scaled to that image.</p>
  <div class="page-wrap" style="width:667px;"><section class="page" style="width:667px;height:766px;"><img class="page-img" src="source_preview.jpg" width="667" height="766" alt="source preview page 1" /><div class="overlay" style="width:667px;height:766px;"><div class="box-table" title="TABLE 0 (two_column_form)" style="left:26px;top:10px;width:579px;height:726px;"></div>
<div class="box-table" title="TABLE 1 (wide_grid)" style="left:26px;top:95px;width:586px;height:122px;"></div>
<div class="box-table" title="TABLE 2 (wide_grid)" style="left:27px;top:337px;width:601px;height:77px;"></div>
<div class="box-table" title="TABLE 3 (wide_grid)" style="left:27px;top:427px;width:571px;height:138px;"></div>
<div class="box-block type-header" title="BLOCK 0: header" style="left:163px;top:10px;width:342px;height:12px;"></div>
<div class="box-block type-header" title="BLOCK 1: header" style="left:27px;top:43px;width:467px;height:67px;"></div>
<div class="box-block type-table" title="BLOCK 2: table" style="left:26px;top:95px;width:586px;height:92px;"></div>
<div class="box-block type-table_row" title="BLOCK 3: table_row" style="left:26px;top:190px;width:521px;height:27px;"></div>
<div class="box-block type-table_row" title="BLOCK 4: table_row" style="left:294px;top:229px;width:102px;height:13px;"></div>
<div class="box-block type-table_row" title="BLOCK 5: table_row" style="left:44px;top:246px;width:387px;height:26px;"></div>
<div class="box-block type-table_row" title="BLOCK 6: table_row" style="left:27px;top:280px;width:578px;height:49px;"></div>
<div class="box-block type-table" title="BLOCK 7: table" style="left:27px;top:337px;width:601px;height:119px;"></div>
<div class="box-block type-table_row" title="BLOCK 8: table_row" style="left:27px;top:467px;width:517px;height:98px;"></div>
<div class="box-block type-table_row" title="BLOCK 9: table_row" style="left:27px;top:566px;width:541px;height:36px;"></div>
<div class="box-block type-table" title="BLOCK 10: table" style="left:26px;top:617px;width:517px;height:44px;"></div>
<div class="box-block type-footer" title="BLOCK 11: footer" style="left:28px;top:693px;width:609px;height:27px;"></div>
<div class="box-block type-footer" title="BLOCK 12: footer" style="left:27px;top:723px;width:302px;height:13px;"></div></div></section></div>
</body>
</html>
